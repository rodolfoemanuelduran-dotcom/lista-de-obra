<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15804a">
<meta name="description" content="Lista de materiales para obra: catálogo Acqua System, Duratop y Sigas con fotos reales, PDF y envío por WhatsApp.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lista de Obra">
<title>Lista de Obra</title>
<link rel="icon" href="logo-red.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: app de obra, una columna (máx. 860px) con barra superior fija y barra inferior "Mi lista"; las piezas son fichas con foto real y botones de medida. */
:root{
  --bg:#f1f4f2;
  --surface:#ffffff;
  --surface-2:#e9efec;
  --ink:#16201c;
  --muted:#55645d;
  --line:#d3ddd8;
  --agua:#15804a;
  --agua-soft:#e0f1e7;
  --agua-ink:#0e5c35;
  --on-agua:#ffffff;
  --graf:#262b29;
  --graf-soft:#e6e9e7;
  --on-graf:#f4f6f5;
  --gas:#f0c30f;
  --gas-soft:#fff3c4;
  --gas-ink:#5a4500;
  --rojo:#e03a3e;
  --azul:#2f7fe0;
  --alerta:#b42318;
  --badge:#16201c;
  --on-badge:#ffffff;
  --photo:#ffffff;
  --shadow:0 1px 2px rgba(22,32,28,.06),0 6px 18px rgba(22,32,28,.08);
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1210;--surface:#151c19;--surface-2:#1d2622;--ink:#e6eeea;--muted:#9fb1a8;--line:#2d3934;
    --agua:#3bc27a;--agua-soft:#14301f;--agua-ink:#94e2b7;--on-agua:#06210f;
    --graf:#dfe5e2;--graf-soft:#232b28;--on-graf:#141a17;
    --gas:#f3cd36;--gas-soft:#352d07;--gas-ink:#f6dc6e;--alerta:#ff8f80;
    --badge:#eef4f1;--on-badge:#101614;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1210;--surface:#151c19;--surface-2:#1d2622;--ink:#e6eeea;--muted:#9fb1a8;--line:#2d3934;
  --agua:#3bc27a;--agua-soft:#14301f;--agua-ink:#94e2b7;--on-agua:#06210f;
  --graf:#dfe5e2;--graf-soft:#232b28;--on-graf:#141a17;
  --gas:#f3cd36;--gas-soft:#352d07;--gas-ink:#f6dc6e;--alerta:#ff8f80;
  --badge:#eef4f1;--on-badge:#101614;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--gas);outline-offset:2px}
img{display:block}

#app{max-width:860px;margin:0 auto;min-height:100%}

/* Barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;padding:8px 10px;min-height:58px}
.ab-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ab-btn:hover{background:var(--surface-2)}
.ab-btn svg{width:24px;height:24px}
.ab-title{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.ab-title b{font-family:var(--font-display);font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-logo{width:40px;height:40px;margin-left:2px;display:block}
.ab-logo svg{width:40px;height:40px;display:block}
.ab-right{display:flex;gap:2px}

/* Vista */
#view{padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
.sec-title{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-family:var(--font-body)}
.muted{color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* Inicio */
.obra-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.obra-card .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.obra-card .n{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1;grid-column:1}
.obra-card .m{font-size:14px;color:var(--muted);grid-column:1}
.obra-card .go{grid-column:2;grid-row:1/span 3;font-weight:700;color:var(--agua-ink);font-size:15px}
.search-fake{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--muted);font-size:16.5px;text-align:left}
.search-fake svg{width:22px;height:22px;flex:none}
.ramas{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.ramas{grid-template-columns:repeat(3,1fr)}}
.rama{display:grid;grid-template-columns:1fr 104px;align-items:center;gap:12px;text-align:left;border-radius:18px;padding:14px 14px 14px 16px;min-height:132px;border:1px solid transparent}
.rama.agua{background:var(--agua-soft);color:var(--agua-ink)}
.rama.desague{background:var(--graf-soft);color:var(--ink);border-color:var(--line)}
.rama.gas{background:var(--gas-soft);color:var(--gas-ink)}
.rama b{display:block;font-family:var(--font-display);font-size:30px;line-height:1;font-weight:700}
.rama .sub{display:block;font-size:14.5px;margin-top:6px;line-height:1.3;opacity:.9}
.rama em{display:inline-block;margin-top:8px;font-style:normal;font-size:13px;font-weight:700;letter-spacing:.04em}
.rama .rph{width:104px;height:104px;border-radius:14px;background:var(--photo);padding:6px;box-shadow:var(--shadow)}
.rama .rph img{width:100%;height:100%;object-fit:contain}
@media (min-width:700px){.rama{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rama .rph{order:-1;width:100%;height:auto;aspect-ratio:1.4;padding:10px}}
.home-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hl{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:600;font-size:14.5px}
.hl svg{width:24px;height:24px;color:var(--agua-ink)}
.foot-note{font-size:13px;color:var(--muted);text-align:center;line-height:1.4}

/* Rama y categorías */
.rama-head{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px}
.rama-head.agua{background:var(--agua-soft);color:var(--agua-ink)}
.rama-head.desague{background:var(--graf-soft);color:var(--ink);border:1px solid var(--line)}
.rama-head.gas{background:var(--gas-soft);color:var(--gas-ink)}
.rama-head p{font-size:14.5px;line-height:1.35}
.notice{font-size:14px;border:1px solid var(--gas);background:var(--gas-soft);color:var(--gas-ink);border-radius:12px;padding:9px 12px;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.cat .cph{background:var(--photo);border-radius:11px;aspect-ratio:1.25;display:grid;place-items:center;padding:8px}
.cat .cph img{width:100%;height:100%;object-fit:contain}
.cat b{font-family:var(--font-display);font-size:19px;line-height:1.1}
.cat span{font-size:13px;color:var(--muted)}

/* Filtro de medidas */
.chips-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;margin:-16px -16px 0;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.chips-lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:48px;height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.chip small{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:1px}
.chip.on{background:var(--agua);border-color:var(--agua);color:var(--on-agua)}
.chip.on small{color:var(--on-agua);opacity:.85}
.filter-info{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{font-weight:700;color:var(--agua-ink);padding:4px 0}

/* Fichas de modelo */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card-top{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:start}
.ph{width:92px;height:92px;border-radius:12px;background:var(--photo);border:1px solid var(--line);padding:4px;display:block}
.ph img{width:100%;height:100%;object-fit:contain}
.ctx{min-width:0;display:flex;flex-direction:column;gap:3px}
.ctx h3{font-size:20px;line-height:1.1}
.ln{font-size:13px;font-weight:700;letter-spacing:.03em}
.ln.agua{color:var(--agua-ink)} .ln.desague{color:var(--muted)} .ln.gas{color:var(--gas-ink)}
.unit{font-size:13px;color:var(--muted)}
.hot{align-self:flex-start;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px;border:1.5px solid;margin-top:2px}
.hot.fria{color:var(--azul);border-color:var(--azul)}
.hot.caliente{color:var(--rojo);border-color:var(--rojo)}
.hot.ambas{color:var(--ink);border-color:var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--azul) 16%,transparent),color-mix(in srgb,var(--rojo) 16%,transparent))}
.hot.reuso{color:#7b4fb3;border-color:#a77fd8}
.info-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:14px 10px;padding:6px 8px 0 0}
.size{position:relative;min-width:60px;min-height:52px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center;max-width:100%}
.size .sm{font-family:var(--font-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.size .sm.long{font-family:var(--font-body);font-weight:600;font-size:14px;line-height:1.2}
.size .ss{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.size.has{border-color:var(--agua);background:var(--agua-soft)}
.size.act{box-shadow:0 0 0 2px var(--agua)}
.size:active{transform:scale(.97)}
.badge{position:absolute;top:0;right:0;transform:translate(45%,-50%);min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--badge);color:var(--on-badge);font-style:normal;font-weight:700;font-size:13px;line-height:24px;text-align:center;box-shadow:0 0 0 2px var(--surface);font-variant-numeric:tabular-nums;white-space:nowrap}
.stepper{display:grid;grid-template-columns:1fr 48px auto 48px;gap:6px;align-items:center;background:var(--surface-2);border-radius:14px;padding:8px}
.st-info{min-width:0;display:flex;flex-direction:column;line-height:1.2;padding-left:4px}
.st-info b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-info .mono{font-size:12.5px;color:var(--muted)}
.st-b{width:48px;height:48px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:26px;font-weight:600;line-height:1;display:grid;place-items:center}
.st-q{min-width:64px;height:48px;padding:0 8px;border-radius:12px;background:var(--surface);border:1.5px solid var(--agua);font-family:var(--font-display);font-weight:700;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.st-q small{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.st-in{width:84px;height:48px;border-radius:12px;border:2px solid var(--agua);background:var(--surface);text-align:center;font-family:var(--font-display);font-weight:700;font-size:22px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:18px}

/* Buscador */
.search-box{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;margin:-16px -16px 0;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.search-in{width:100%;height:50px;border-radius:14px;border:2px solid var(--agua);background:var(--surface);padding:0 14px;font-size:17px}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:7px 12px;font-weight:600;font-size:14.5px}

/* Mi lista */
.form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.form-head h2{font-size:22px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px 11px;font-size:16px;min-height:44px}
.fld textarea{resize:vertical;min-height:60px}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--agua);outline-offset:0;background:var(--surface)}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:6px 12px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.grp-h.agua{background:var(--agua);color:var(--on-agua)}
.grp-h.desague{background:var(--graf);color:var(--on-graf)}
.grp-h.gas{background:var(--gas);color:#3d2f00}
.grp-h span{font-family:var(--font-body);font-size:13px;font-weight:600;opacity:.9}
.row{display:grid;grid-template-columns:64px 1fr;gap:8px 18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px 12px}
.row-ph{position:relative;width:64px;height:64px;border-radius:10px;background:var(--photo);border:1px solid var(--line);padding:3px}
.row-ph img{width:100%;height:100%;object-fit:contain}
.row-ph .badge{transform:translate(35%,-45%)}
.row-tx{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.25}
.row-tx b{font-size:15.5px}
.row-tx .md{font-size:14px}
.row-tx .mono{font-size:12.5px;color:var(--muted)}
.row-tx .tir{font-size:13px;font-weight:700;color:var(--agua-ink)}
.row-st{grid-column:2;display:flex;gap:6px;align-items:center}
.row-st .st-b{width:40px;height:40px;font-size:22px}
.row-st .st-q{min-width:46px;height:40px;font-size:19px}
.row-del{margin-left:auto;font-size:14px;font-weight:700;color:var(--alerta);padding:8px 4px 8px 10px}
@media (min-width:560px){.row{grid-template-columns:64px 1fr auto;align-items:center}.row-st{grid-column:3}}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.totals b{font-family:var(--font-display);font-size:20px}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--gas-soft);border:1px solid var(--gas);color:var(--gas-ink);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600}

/* Obras, datos, acerca */
.list-cards{display:flex;flex-direction:column;gap:10px}
.ob{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ob.cur{border-color:var(--agua);box-shadow:0 0 0 1px var(--agua)}
.ob-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ob-h b{font-family:var(--font-display);font-size:21px;line-height:1.1}
.ob-h span{font-size:13px;color:var(--muted);white-space:nowrap}
.ob .meta{font-size:14px;color:var(--muted)}
.ob-actions{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;font-weight:700;color:var(--on-agua);background:var(--agua);border-radius:5px;padding:1px 7px}
.about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 16px}
.about svg{width:150px;height:150px}
.about h2{font-size:30px}
.about p{max-width:52ch;font-size:15.5px}
.about .small{font-size:13.5px;color:var(--muted)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15.5px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--agua);border-color:var(--agua);color:var(--on-agua)}
.btn.warn{border-color:var(--alerta);color:var(--alerta)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}

/* Barra inferior */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.06);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bb-in{max-width:836px;margin:0 auto;display:flex;gap:8px}
.bb-list{flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--graf);color:var(--on-graf);border-radius:14px;padding:10px 16px;min-height:56px;text-align:left}
.bb-list svg{width:24px;height:24px}
.bb-list b{font-family:var(--font-display);font-size:21px;display:block;line-height:1}
.bb-list span{font-size:13.5px;opacity:.85}
.bb-count{position:relative;min-width:32px;height:32px;border-radius:16px;background:var(--agua);color:var(--on-agua);font-weight:700;display:grid;place-items:center;padding:0 8px;font-variant-numeric:tabular-nums}
.bb-actions{flex:1;display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px}
.bb-actions .btn{min-height:52px}
.more{position:relative}
.menu{position:absolute;right:0;bottom:60px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:220px}
.menu button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;font-weight:600;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu button.warn{color:var(--alerta)}
.menu svg{width:20px;height:20px}

/* Hoja de datos */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,13,.48)}
.sheet-panel{position:relative;width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:22px;max-height:84vh}}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.sh-k{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-ph{background:var(--photo);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;place-items:center}
.sh-ph img{width:min(240px,70vw);height:min(240px,70vw);object-fit:contain}
.sh-n{font-size:26px;line-height:1.1}
.sh-meta{font-size:14px;color:var(--muted)}
.sh-note{font-size:15px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.vt{width:100%;border-collapse:collapse;font-size:15px}
.vt th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.vt td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.vt td.q{text-align:right;white-space:nowrap}
.vt .mini{display:inline-grid;grid-template-columns:34px auto 34px;gap:4px;align-items:center}
.vt .mini button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);font-size:19px;font-weight:600}
.vt .mini span{min-width:30px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:18px}

/* Aviso */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--graf);color:var(--on-graf);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Estado guardado en el celular ---------- */
const KEY = 'listadeobra-v1';

if (!S || S.v !== 1 || typeof S.obras !== 'object') S = {v: 1, perfil: {nombre: '', tel: '', email: '', mat: '', dir: ''}, obras: {}, cur: null, seq: 1, filt: {}};

function save(now) {
  clearTimeout(saveTimer);

}
window.addEventListener('pagehide', () => save(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(true); });

function newObra(base) {
  const id = 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const o = {id, num: S.seq++, obra: '', cliente: '', dir: '', fecha: today(), notas: '', items: {}, created: Date.now(), updated: Date.now()};
  if (base) {
    o.items = JSON.parse(JSON.stringify(base.items || {}));
    o.obra = (base.obra || base.cliente || 'Obra') + ' (copia)';
    o.cliente = base.cliente || ''; o.dir = base.dir || ''; o.notas = base.notas || '';
  }
  S.obras[id] = o; S.cur = id; save();
  return o;
}
function cur() { if (!S.cur || !S.obras[S.cur]) newObra(); return S.obras[S.cur]; }

  CAT = c; FAM = c.fams; let k = 0;

    f._t = t;
  });
}

/* ---------- Medidas ---------- */
function frac(s) {
  return s.replace(/(\d)[ .\-](1\/4|1\/2|3\/4)/g, (m, a, b) => a + ({'1/4': '¼', '1/2': '½', '3/4': '¾'}[b]))
    .replace(/\b1\/2\b/g, '½').replace(/\b3\/4\b/g, '¾').replace(/\b1\/4\b/g, '¼').replace(/\b3\/8\b/g, '⅜');
}
function fmtLabel(l) {
  if (!l) return '';
  let s = String(l).replace(/[”"]/g, '″').replace(/(\d)\s*[xX]\s*(?=\d)/g, '$1 × ').replace(/ [xX] /g, ' × ').replace(/(\d)mm/g, '$1 mm');
  s = frac(s).replace(/\s+/g, ' ').trim();
  return s;
}
function plainD(label) { const m = String(label || '').trim().match(/^(\d{2,3})(?:\s*mm)?$/i); return m ? +m[1] : 0; }
function medida(label, r) {
  const d = plainD(label);
  if (d) return d + ' mm' + (r !== 'desague' && INCH[d] ? ' (' + INCH[d] + '″)' : '');
  let t = fmtLabel(label);
  if (r !== 'desague' && /^\d{2,3} × (\d?[¼½¾⅜]|\d)$/.test(t)) t = t.replace(/^(\d{2,3}) × /, '$1 mm × ') + '″';
  return t;
}
function sizeParts(label, r) {
  const d = plainD(label);
  if (d) return {main: String(d), sub: r !== 'desague' && INCH[d] ? INCH[d] + '″' : 'mm', long: false};
  let t = fmtLabel(label);
  if (r !== 'desague' && /^\d{2,3} × (\d?[¼½¾⅜]|\d)$/.test(t)) t += '″';
  if (!t) return {main: 'Agregar', sub: '', long: true};
  return {main: t, sub: '', long: t.length > 9};
}
function keysOf(v) {
  if (v[2] && v[2].length) return v[2].filter(n => n >= 16 && n <= 200).map(String);
  const t = String(v[1] || '');
  if (/["”″]/.test(t)) { const first = fmtLabel(t.split(/[xX]/)[0]).replace(/[″\s]/g, '').replace(/H-H|M-H|H-M/g, ''); if (first) return [first + '″']; }
  return [];
}
const INCH_VAL = {'⅜': .375, '½': .5, '¾': .75, '¼': .25};
function keyVal(k) {
  if (/^\d+$/.test(k)) return +k;

}

function qOf(code) { const it = cur().items[code]; return it ? it.q : 0; }

  if (f.u === 'm') { const t = tiras(f, q); return q + ' m<small>' + t + (t === 1 ? ' tira' : ' tiras') + '</small>'; }

/* ---------- Navegación ---------- */

  if (NAV.length <= 1) return;

/* ---------- Render ---------- */
function render() {
  const st = top();
  closeMenu();
  let html = '', title = '', sub = '';
  switch (st.v) {
    case 'home': html = viewHome(); break;
    case 'rama': html = viewRama(st.r); title = RM[st.r].n; sub = 'Elegí una categoría'; break;
    case 'cat': html = viewCat(st.r, st.c); title = CATNAME[st.r + '/' + st.c]; sub = RM[st.r].n; break;
    case 'search': html = viewSearch(st); title = 'Buscar'; sub = 'Pieza, medida o código'; break;
    case 'list': html = viewList(); title = 'Mi lista'; sub = listSub(cur()); break;
    case 'obras': html = viewObras(st); title = 'Mis obras'; sub = 'Se guardan en este celular'; break;
    case 'perfil': html = viewPerfil(); title = 'Mis datos'; sub = 'Salen en el encabezado del PDF'; break;
    case 'about': html = viewAbout(); title = 'Acerca de'; sub = 'Lista de Obra'; break;
  }
  renderBar(st, title, sub);
  $('#view').innerHTML = html;
  if (st.v === 'cat' || st.v === 'search') restoreActive();
  if (st.v === 'search') { const i = $('#q'); if (i) { i.value = st.q || ''; if (!st.q) i.focus(); } }
  updateBottom();
}

/* ---------- Buscador ---------- */
const SYN = {cano: 'tubo', canos: 'tubo', canerias: 'tubo', caneria: 'tubo', tubos: 'tubo', tee: 'te', tes: 'te', codos: 'codo', curvas: 'curva', uniones: 'union', llaves: 'llave', canilla: 'llave', valvulas: 'valvula',
  termofusora: 'thermofusor', termofusor: 'thermofusor', abrazadera: 'grampa', abrazaderas: 'grampa', grampas: 'grampa', rejillas: 'rejilla', piletas: 'pileta', embudos: 'embudo', tapones: 'tapon', tapas: 'tapa',
  bujes: 'buje', cuplas: 'cupla', ramales: 'ramal', reducciones: 'reduccion', aqua: 'acqua', boquillas: 'boquilla', grifo: 'llave'};
const STOP = new Set(['de', 'a', 'con', 'para', 'el', 'la', 'los', 'las', 'y', 'mm', 'pulgada', 'pulgadas', 'por', 'en', 'un', 'una_']);
const BOOST = {};
function setupBoost() {
  const fav = [['agua', 'Codo a 90°'], ['agua', 'Te normal'], ['agua', 'Unión doble con tuerca plástica'], ['agua', 'Unión normal'], ['agua', 'Tubo Acqua System Magnum PN20'],
    ['agua', 'Llave de paso c/cabezal de polímero-bronce (pasaje total)'], ['agua', 'Codo 90° con rosca hembra'], ['agua', 'Tubo hembra'], ['agua', 'Tubo macho'], ['agua', 'Buje de reducción'],
    ['desague', "Codo a 87° 30' M-H"], ['desague', 'Codo a 45° M-H'], ['desague', 'Ramal simple a 45°'], ['desague', 'Tubo M-H Duratop X Ø110'], ['desague', 'Tubo M-H Duratop X Ø40'], ['desague', 'Tubo M-H Duratop X Ø63'],
    ['gas', 'Codo a 90°'], ['gas', 'Te normal'], ['gas', 'Caño acero polietileno']];
  Object.values(FAM).forEach(f => { const i = fav.findIndex(x => x[0] === f.r && x[1] === f.n); if (i >= 0) BOOST[f.id] = 30 - i; });
}
function parseQuery(q) {
  let s = ' ' + norm(q) + ' ';
  const sizes = [];
  const phr = [[/ tres cuartos? /g, ['25', '¾″']], [/ media pulgada | media /g, ['20', '½″']], [/ una pulgada | una /g, ['32', '1″']], [/ pulgada y cuarto /g, ['40', '1¼″']], [/ pulgada y media /g, ['50', '1½″']]];
  phr.forEach(([re, val]) => { if (re.test(s)) { sizes.push(val); s = s.replace(re, ' '); } });
  const toks = s.split(/[\s,;]+/).filter(Boolean);
  const words = [], codes = [];
  toks.forEach(t => {
    if (/^\d{2}-?\d{3,}[a-z0-9]*$/.test(t)) { codes.push(t.replace('-', '')); return; }
    if (/^\d{2,3}$/.test(t)) { const a = [t]; a.num = t; sizes.push(a); return; }
    const fr = t.match(/^(\d)\/(\d)"?$/); if (fr) { const map = {'1/2': ['20', '½″'], '3/4': ['25', '¾″'], '1/4': ['¼″'], '3/8': ['⅜″']}; sizes.push(map[fr[1] + '/' + fr[2]] || [t]); return; }
    if (/^\d"$/.test(t)) { sizes.push([t.replace('"', '') + '″']); return; }
    if (STOP.has(t)) return;
    words.push(SYN[t] || t);
  });
  return {words, sizes, codes};
}
function search(q) {
  const {words, sizes, codes} = parseQuery(q);
  if (!words.length && !sizes.length && !codes.length) return [];
  const out = [];
  Object.values(FAM).forEach(f => {
    let score = 0;
    const nmw = ' ' + norm(f.n).replace(/-/g, ' ') + ' ' + (/macho-hembra|\bm-h\b/.test(norm(f.n)) ? 'mh ' : '') + (/\bh-h\b/.test(norm(f.n)) ? 'hh ' : '');
    for (const w of words) {
      const re = new RegExp('(^|[\\s(/-])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (!re.test(f._t)) return;
      if (re.test(nmw) || re.test(norm(f.n))) score += norm(f.n).startsWith(w) ? 9 : 6; else score += 1;
    }
    let idx = f.v.map((v, i) => i);
    if (codes.length) idx = idx.filter(i => codes.some(c => f.v[i][0].replace('-', '').toLowerCase().startsWith(c)));
    const nm = norm(f.n);
    const need = sizes.filter(alts => { if (alts.num && new RegExp('(^|\\D)' + alts.num + '(\\D|$)').test(nm)) { score += 3; return false; } return true; });
    if (need.length) idx = idx.filter(i => { const ks = keysOf(f.v[i]); return need.every(alts => alts.some(a => ks.includes(a))); });
    if (!idx.length) return;
    if (!words.length && !codes.length) score += 1;
    score += (BOOST[f.id] || 0) / 10 + (codes.length ? 5 : 0);
    out.push({fid: f.id, idx, score});
  });
  out.sort((a, b) => b.score - a.score || ORD[a.fid] - ORD[b.fid]);
  return out.slice(0, 40);
}
function viewSearch(st) {
  return `<div class="search-box"><input class="search-in" id="q" type="search" inputmode="search" autocomplete="off" placeholder="Ej.: codo 20, te 25, unión doble, 08-0900" aria-label="Buscar en el catálogo"></div>
    <div id="results">${resultsHTML(st.q || '')}</div>`;
}
function resultsHTML(q) {
  if (!q.trim()) {
    const sug = ['codo 20', 'te 25', 'unión doble 20', 'llave de paso', 'tubo macho 20', 'codo 110', 'ramal 45', 'pileta de patio', 'tubo 110', 'grampa', 'regulador', 'sigas codo'];
    return `<p class="sec-title">Probá con</p><div class="sugs">${sug.map(s => `<button class="sug" data-act="sug" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <p class="muted" style="font-size:14.5px">Podés escribir la pieza, la medida en mm o en pulgadas (“media”, “3/4”) o el código del catálogo.</p>`;

}

/* ---------- Mi lista ---------- */
function sortedItems(o) {
  const arr = [];
  Object.keys(o.items).forEach(code => {
    const ref = CODE[code]; if (!ref) return;
    const it = o.items[code]; const fid = FAM[it.f] && FAM[it.f].v.some(v => v[0] === code) ? it.f : ref.fid;
    const f = FAM[fid]; const vi = f.v.findIndex(v => v[0] === code);
    arr.push({code, q: it.q, fid, f, vi, label: f.v[vi][1]});
  });
  arr.sort((a, b) => RAMA_ORDER.indexOf(a.f.r) - RAMA_ORDER.indexOf(b.f.r) || ORD[a.fid] - ORD[b.fid] || a.vi - b.vi);
  return arr;
}
function pieces(items) { return items.reduce((a, x) => a + (x.f.u === 'm' ? tiras(x.f, x.q) : x.q), 0); }
function pipeMeters(items) {
  const m = {};
  items.filter(x => x.f.u === 'm').forEach(x => { const d = plainD(x.label) || x.label; const k = x.f.r + '|' + d; m[k] = (m[k] || 0) + x.q; });
  return Object.keys(m).map(k => { const [r, d] = k.split('|'); return {r, d, m: m[k]}; }).sort((a, b) => RAMA_ORDER.indexOf(a.r) - RAMA_ORDER.indexOf(b.r) || a.d - b.d);
}

/* ---------- Hoja de datos ---------- */
function openSheet(fid) {
  const f = FAM[fid]; const sh = $('#sheet');
  const notes = [];
  if (f.nt && f.nt.length) notes.push(esc(f.nt.join(' ')));
  if (f.hot) notes.push('<b>Uso:</b> ' + esc(f.hot[1]) + '. ' + (f.hot[0] === 'fria' ? 'No apto para agua caliente.' : f.hot[0] === 'reuso' ? 'Lleva la leyenda NO POTABLE.' : 'Apto para agua caliente.'));
  if (f.l === 'Acqua System' && f.u !== 'm' && ['codos', 'tes', 'uniones', 'reducciones', 'roscas', 'llaves', 'tapas'].includes(f.c)) notes.push('Sirve para agua fría y caliente: el uso lo define el caño (PN12 solo fría; PN20 y PN25, fría y caliente).');
  if (f.u === 'm') notes.push('Se compra en tiras de ' + (f.bar || 4) + ' m. En la lista cargás los metros y la app calcula las tiras.');
  const rows = f.v.map(v => { const q = qOf(v[0]); return `<tr><td class="mono">${v[0]}</td><td>${esc(medida(v[1], f.r) || '—')}</td>
      <td class="q"><span class="mini" data-code="${v[0]}" data-fid="${fid}"><button data-act="sdec" aria-label="Restar">−</button><span data-qv="${v[0]}">${q ? esc(badgeText(f, q)) : '0'}</span><button data-act="sinc" aria-label="Sumar">+</button></span></td></tr>`; }).join('');
  sh.innerHTML = `<div class="sheet-bg" data-act="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="${esc(f.n)}">
      <div class="sh-top"><span class="sh-k">Datos del catálogo</span><button class="ab-btn" data-act="close-sheet" aria-label="Cerrar">${ICON.close}</button></div>
      <div class="sh-ph"><img src="img/${fid}.webp" alt="${esc(f.n)}"></div>
      <h2 class="sh-n">${esc(f.n)}</h2>
      <p class="sh-meta">${esc(f.l)} · ${esc(CATNAME[f.r + '/' + f.c])} · Catálogo Sistemas 2026, pág. ${f.pg}</p>
      ${notes.length ? `<div class="sh-note">${notes.join('<br>')}</div>` : ''}
      <table class="vt"><thead><tr><th>Código</th><th>Medida</th><th style="text-align:right">Cantidad</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  sh.hidden = false;
  if (USE_HISTORY && !sheetHist) { try { history.pushState({sheet: 1}, ''); sheetHist = true; } catch (e) {} }
  const c = $('[data-act="close-sheet"].ab-btn', sh); if (c) c.focus();
}
function hideSheet() { const sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; }
function closeSheet(fromUI) {

/* ---------- Edición de cantidad ---------- */
function editQty(btn, fid, code) {
  const f = FAM[fid]; const q = qOf(code);
  const inp = document.createElement('input');
  inp.type = 'number'; inp.inputMode = 'decimal'; inp.min = '0'; inp.step = f.u === 'm' ? '0.5' : '1'; inp.className = 'st-in'; inp.value = q || '';
  inp.setAttribute('aria-label', f.u === 'm' ? 'Metros' : 'Cantidad');
  btn.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    const v = parseFloat(String(inp.value).replace(',', '.'));
    const nb = document.createElement('button'); nb.className = 'st-q'; nb.dataset.act = 'edit'; nb.setAttribute('aria-label', 'Escribir cantidad');
    inp.replaceWith(nb);
    setQ(fid, code, isNaN(v) ? q : v);
    nb.innerHTML = qtyHTML(f, qOf(code));
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') { inp.value = q; commit(); } });
  inp.addEventListener('blur', commit);
}

/* ---------- Clicks ---------- */
let lpFired = false;
document.addEventListener('click', e => {
  if (lpFired) { lpFired = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.menu')) closeMenu(); return; }
  const act = el.dataset.act;
  if (act !== 'menu' && !el.closest('.menu')) closeMenu();
  switch (act) {
    case 'back': back(); break;
    case 'go-search': go({v: 'search', q: ''}); break;
    case 'go-obras': go({v: 'obras'}); break;
    case 'go-perfil': go({v: 'perfil'}); break;
    case 'go-about': go({v: 'about'}); break;
    case 'go-list': if (top().v !== 'list') go({v: 'list'}); break;
    case 'go-rama': go({v: 'rama', r: el.dataset.r}); break;
    case 'go-cat': go({v: 'cat', r: el.dataset.r, c: el.dataset.c}); break;
    case 'chip': { const r = el.dataset.r, k = el.dataset.k; const s = new Set(S.filt[r] || []); s.has(k) ? s.delete(k) : s.add(k); S.filt[r] = Array.from(s); save(); render(); window.scrollTo(0, 0); break; }
    case 'chip-all': S.filt[el.dataset.r] = []; save(); render(); break;
    case 'add': {
      const code = el.dataset.code; const c = el.closest('.card'); const f = FAM[c.dataset.fid];
      step(f.id, code, f.u === 'm' ? (f.bar || 4) : 1); showStepper(c, f.id, code);
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (x) {} }
      break;
    }
    case 'inc': case 'dec': {
      const box = el.closest('[data-code]'); const code = box.dataset.code; const ff = box.dataset.fid || (CODE[code] || {}).fid;
      step(ff, code, act === 'inc' ? 1 : -1); break;
    }
    case 'sinc': case 'sdec': { const box = el.closest('[data-code]'); step(box.dataset.fid, box.dataset.code, act === 'sinc' ? 1 : -1); break; }
    case 'edit': { const box = el.closest('[data-code]'); editQty(el, box.dataset.fid || (CODE[box.dataset.code] || {}).fid, box.dataset.code); break; }
    case 'del': { const row = el.closest('.row'); setQ(row.dataset.fid, row.dataset.code, 0); toast('Quitado de la lista'); break; }
    case 'info': { const host = el.closest('[data-fid]'); if (host) openSheet(host.dataset.fid); break; }
    case 'close-sheet': closeSheet(true); break;
    case 'sug': { const i = $('#q'); i.value = el.dataset.q; top().q = el.dataset.q; $('#results').innerHTML = resultsHTML(el.dataset.q); break; }
    case 'menu': { const m = $('#menu'); if (m) closeMenu(); else openMenu(el); break; }
    case 'clear': { if (top().clearArm) { cur().items = {}; cur().updated = Date.now(); save(); top().clearArm = false; render(); toast('Lista vacía'); } else { top().clearArm = true; toast('Tocá “Vaciar lista” otra vez para confirmar', 3500); setTimeout(() => { top().clearArm = false; }, 4000); } break; }
    case 'ob-new': { newObra(); toast('Nueva obra creada'); if (top().v === 'list') render(); else go({v: 'list'}); break; }
    case 'ob-open': { S.cur = el.closest('.ob').dataset.id; save(); go({v: 'list'}); break; }
    case 'ob-dup': { const o = S.obras[el.closest('.ob').dataset.id]; newObra(o); toast('Obra duplicada y abierta'); go({v: 'list'}); break; }
    case 'ob-del': {
      const id = el.closest('.ob').dataset.id; const st = top();
      if (st.del === id) { delete S.obras[id]; if (S.cur === id) S.cur = null; st.del = null; save(); render(); toast('Obra borrada'); }
      else { st.del = id; render(); }
      break;
    }
    case 'pdf-share': sharePDF(); break;
    case 'pdf-download': closeMenu(); downloadPDF(); break;
    case 'text-share': shareText(); break;
    case 'text-copy': closeMenu(); copyText(); break;
    case 'backup': backup(); break;
  }
});

function plainLabel(s) { return String(s || ''); }
function listText() {
  const o = cur(); const items = sortedItems(o); const p = S.perfil;

  L.push('*LISTA DE MATERIALES N° ' + pad(o.num, 4) + '*');
  if (o.cliente) L.push('Cliente: ' + o.cliente);

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (x) {} ta.remove(); return ok;
  }
}
function shareText() {
  const text = listText();
  if (!IN_VIEWER && navigator.share) { navigator.share({text}).catch(() => {}); return; }
  copyText(true);
}
function copyText(withLink) {
  const text = listText();
  copyToClipboard(text).then(ok => {
    if (withLink) {
      const sh = $('#sheet');
      sh.innerHTML = `<div class="sheet-bg" data-act="close-sheet"></div><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Enviar como texto">

        <textarea readonly style="width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2);font-size:14px">${esc(text)}</textarea></div>`;
      sh.hidden = false;
    } else toast(ok ? 'Lista copiada como texto' : 'No se pudo copiar');

/* ---------- Guardar archivos ---------- */
let DL = null, DL_TRIED = false;
async function downloadsCap() { if (DL_TRIED) return DL; DL_TRIED = true; try { DL = IN_VIEWER ? await window.claude.use('downloads') : null; } catch (e) { DL = null; } return DL; }
async function saveFile(name, blob) {
  const cap = await downloadsCap();
  if (cap) {
    try { await cap.save({filename: name, data: blob}); toast('Archivo guardado'); return true; }
    catch (e) { if (e && e.code === 'declined') return false; toast('No se pudo guardar el archivo'); return false; }
  }
  try {
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000); return true;
  } catch (e) { toast('No se pudo guardar el archivo'); return false; }
}
function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'obra'; }
function pdfName(o) { return 'Lista-' + pad(o.num, 4) + '-' + slug(obraName(o)) + '.pdf'; }
let busy = false;
async function downloadPDF() {
  if (busy) return; busy = true; toast('Armando el PDF…', 8000);
  try { const o = cur(); const bytes = await makeListPDF(o); await saveFile(pdfName(o), new Blob([bytes], {type: 'application/pdf'})); }
  catch (e) { console.error(e); toast('No se pudo armar el PDF'); }
  busy = false;
}
async function sharePDF() {
  if (busy) return; busy = true; toast('Armando el PDF…', 8000);
  try {
    const o = cur(); const bytes = await makeListPDF(o); const name = pdfName(o);
    const blob = new Blob([bytes], {type: 'application/pdf'});
    let shared = false;
    if (!IN_VIEWER && navigator.canShare) {
      const file = new File([blob], name, {type: 'application/pdf'});
      if (navigator.canShare({files: [file]})) {
        try { await navigator.share({files: [file], title: 'Lista de materiales N° ' + pad(o.num, 4), text: 'Lista de materiales — ' + obraName(o)}); shared = true; $('#toast').hidden = true; }
        catch (e) { if (e && e.name === 'AbortError') { shared = true; $('#toast').hidden = true; } }
      }
    }
    if (!shared) await saveFile(name, blob);
  } catch (e) { console.error(e); toast('No se pudo armar el PDF'); }
  busy = false;
}
function backup() {
  const data = JSON.stringify({app: 'lista-de-obra', v: 1, fecha: new Date().toISOString(), datos: S}, null, 1);
  saveFile('lista-de-obra-copia-' + today() + '.json', new Blob([data], {type: 'application/json'}));
}
function restore(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result); const d = j && j.datos;
      if (!d || typeof d.obras !== 'object') throw new Error('formato');
      let n = 0; Object.values(d.obras).forEach(o => { if (o && o.id && o.items) { if (!S.obras[o.id]) n++; S.obras[o.id] = o; } });
      if (d.perfil && !S.perfil.nombre) S.perfil = d.perfil;
      S.seq = Math.max(S.seq, d.seq || 1); save(true); render(); toast('Copia cargada: ' + n + ' obras nuevas');
    } catch (e) { toast('Ese archivo no es una copia de Lista de Obra'); }
  };
  rd.readAsText(file);
}

/* ---------- PDF (generador propio, sin librerías) ---------- */
const CP1252 = {0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E,
  0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F};
function pdfPre(s) { return String(s == null ? '' : s).replace(/″/g, '"').replace(/′/g, "'").replace(/⅜/g, '3/8').replace(/≈/g, '~').replace(/→/g, '->').replace(/ /g, ' '); }
function winBytes(s) { const out = []; for (const ch of pdfPre(s)) { const c = ch.codePointAt(0); if (c < 0x80) out.push(c); else if (CP1252[c]) out.push(CP1252[c]); else if (c >= 0xA0 && c <= 0xFF) out.push(c); else out.push(0x3F); } return out; }
function tw(s, bold, size) { const t = WIDTHS[bold ? 'Helvetica-Bold' : 'Helvetica']; let w = 0; for (const b of winBytes(s)) w += (t[b] || 556); return w * size / 1000; }
function lit(s) { let r = '('; for (const b of winBytes(s)) { if (b === 0x28 || b === 0x29 || b === 0x5C) r += '\\' + String.fromCharCode(b); else if (b < 0x20 || b > 0x7E) r += '\\' + b.toString(8).padStart(3, '0'); else r += String.fromCharCode(b); } return r + ')'; }
function wrapText(s, bold, size, maxW, maxLines) {
  const words = pdfPre(s).split(/\s+/).filter(Boolean); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (tw(t, bold, size) <= maxW) { line = t; continue; }
    if (line) lines.push(line);
    line = w;
    while (tw(line, bold, size) > maxW && line.length > 1) { let k = line.length - 1; while (k > 1 && tw(line.slice(0, k), bold, size) > maxW) k--; lines.push(line.slice(0, k)); line = line.slice(k); }
  }
  if (line) lines.push(line);
